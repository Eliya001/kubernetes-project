name: CI/CD to EKS via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    - name: Build Docker image
      run: |
        docker build -t flask-app:latest .
        docker tag flask-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'


    - name: Configure kubectl for EKS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Update kubeconfig
      run: |
        rm -f $HOME/.kube/config
        aws sts get-caller-indetity
        aws eks describe-cluster --name my-cluster --query "cluster.endpoint"
        aws eks update-kubeconfig --name my-cluster --region ap-southeast-1 --kubeconfig $HOME/.kube/config
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
        kubectl config view
        kubectl get nodes || echo "kubectl failed"

    - name: Verfiy AWS identity
      run: aws sts get-caller-identity

    - name: Debug kubeconfig
      run: |
        kubectl config view

    - name: Update Deployment on EKS
      run: |
        kubectl set image deployment/flask-deployment flask-container=${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
        kubectl rollout status deployment/flask-deployment
